  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"470366a6-c879-4f30-a34c-eec289dc6171\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"094d1f41-6e1c-4db3-8d68-4cfda2f52390\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"470366a6-c879-4f30-a34c-eec289dc6171\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"094d1f41-6e1c-4db3-8d68-4cfda2f52390\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"f34a87b7-19a9-4e26-b68a-48145a632511\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c6c91b8a-e480-4c59-bc72-c06cc50fcc18\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"84d3115d-8493-4205-b585-4fa11e5fc4e5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"6ecc9ec8-bb76-479c-9574-fa3f139a0a9b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"b4449ca5-3cfa-46ce-89dd-25a9208fee58\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 300;\n  font-display: ransparent);\">\n              <div style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-accent-300); margin-bottom: 16px;\">Yang Anda dapatkan<\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px;\">\n                <sc-for list=\"{{ deliverables }}\" as=\"d\" hint-placeholder-count=\"2\">\n                  <div>\n                    <div style=\"font-family: var(--font-heading); font-size: 20px; margin-bottom: 12px;\">{{ d.name }}<\u002Fdiv>\n                    <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n                      <sc-for list=\"{{ d.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                        <div style=\"display: flex; gap: 10px; font-size: 14.5px; line-height: 1.6;\"><span style=\"color: var(--color-accent-300); font-weight: 700;\">✓<\u002Fspan><span>{{ it }}<\u002Fspan><\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep4 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 24px;\">\n          <div style=\"flex: 1; height: 10px; border-radius: 3px; background: var(--color-neutral-300); overflow: hidden;\">\n            <div style=\"height: 100%; width: {{ clPct }}%; background: var(--color-accent-2-600); border-radius: 3px; transition: width 0.3s ease;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 14px; font-weight: 600; color: var(--color-neutral-700); white-space: nowrap;\">{{ clLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <sc-for list=\"{{ clGroups  text-transform: uppercase; color: var(--color-neutral-600);\">{{ s.k }}<\u002Fspan>\n              <span style=\"font-size: 15px; font-weight: 600; text-align: right;\">{{ s.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border-radius: var(--radius-lg); background: var(--color-accent-700); color: var(--color-neutral-100); padding: clamp(22px, 5vw, 32px);\">\n          <div style=\"font-family: var(--font-heading); font-size: 24px; margin-bottom: 10px;\">Kirim brief ke tim DAG Studio<\u002Fdiv>\n          <p style=\"font-size: 15px; line-height: 1.75; color: var(--color-accent-200); margin: 0 0 22px;\">Ringkasan di atas akan terkirim sebagai pesan WhatsApp. Tim kami merespons dalam 1×24 jam.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ sendWA }}\" class=\"btn\" style=\"border-radius: 3px; min-height: 52px; padding: 14px 28px; font-size: 16px; font-weight: 600; background: var(--color-neutral-100); color: var(--color-accent-800); border: none; cursor: pointer; width: 100%;\">Kirim via WhatsApp<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--color-neutral-600); text-align: center;\">Estimasi belum termasuk PPN 11% · harga final setelah survei lokasi<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <div style=\"position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: color-mix(in srgb, var(--color-bg) 94%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--color-divider); padding: 14px clamp(16px, 4vw, 24px);\">\n    <div style=\"max-width: 760px; margin: 0 auto; display: flex; gap: 12px;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" disabled=\"{{ atFirst }}\" class=\"btn btn-secondary\" style=\"border-radius: 3px; min-height: 52px; padding: 14px 24px; font-size: 15px; font-weight: 600; flex: none; cursor: pointer;\">Kembali<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ next }}\" disabled=\"{{ atLast }}\" class=\"btn btn-primary\" style=\"border-radius: 3px; min-height: 52px; padding: 14px 24px; font-size: 15px; font-weight: 600; flex: 1; cursor: pointer;\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;waNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6285220890007&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Kontak&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    step: 1, lingkup: 'allin', checked: {}, rooms: {}, qty: {},\n    f: { nama: '', wa: '', email: '', kota: '', alamat: '', timeline: '', referral: '', catatan: '',\n         tipe: '', ltanah: '', lbang: '', lantai: '', kondisi: '', budget: '', gaya: '', khusus: '',\n         arch: 0, intp: 0, archLabel: '', intLabel: '' }\n  };\n\n  steps = [\n    { n: 1, label: 'Data Klien', kicker: 'Langkah 1 dari 5', title: 'Data klien & lokasi', lead: 'Kami butuh kontak dan lokasi proyek agar tim bisa menindaklanjuti brief Anda.' },\n    { n: 2, label: 'Tipe & Spesifikasi', kicker: 'Langkah 2 dari 5', title: 'Tipe proyek & spesifikasi', lead: 'Tentukan tipologi bangunan beserta luas, lantai, anggaran, dan gaya yang diinginkan.' },\n    { n: 3, label: 'Paket & Ruangan', kicker: 'Langkah 3 dari 5', title: 'Paket desain & ruangan', lead: 'Pilih paket Architecture dan/atau Interior. Estimasi biaya dihitung otomatis di bawah.' },\n    { n: 4, label: 'Checklist', kicker: 'Langkah 4 dari 5', title: 'Kesiapan dokumen & data', lead: 'Tandai apa yang sudah Anda siapkan — sisanya bisa dilengkapi sambil jalan.' },\n    { n: 5, label: 'Ringkasan', kicker: 'Langkah 5 dari 5', title: 'Periksa & kirim', lead: 'Pastikan data sudah benar, lalu kirim brief ke tim DAG Studio via WhatsApp.' }\n  ];\n\n  typeList = [\n    { key: 'residensial', label: 'Residensial' },\n    { key: 'komersial', label: 'Komersial' },\n    { key: 'akademik', label: 'Akademik' },\n    { key: 'publik', label: 'Publik' },\n    { key: 'klinik', label: 'Klinik / Medis' },\n    { key: 'ibadah', label: 'Masjid / Ibadah' }\n  ];\n\n  clGroupsData = [\n    { title: 'Dokumen kepemilikan & perizinan', items: ['Sertifikat tanah (SHM / HGB / SHGB)', 'Foto KTP pemilik / kuasa', 'NPWP pemilik atau badan usaha', 'KKPR / persetujuan RT-RW', 'PBG lama / IMB (bila renovasi)'] },\n    { title: 'Data tapak & lokasi', items: ['Ukuran & luas tanah', 'Foto kondisi eksisting tapak', 'Titik koordinat GPS / link Maps', 'Data kontur / kemiringan lahan', 'Akses jalan, air PDAM & daya PLN'] },\n    { title: 'Kebutuhan ruang & preferensi', items: ['Daftar ruangan yang dibutuhkan', 'Jumlah lantai direncanakan', 'Kapasitas pengguna / penghuni', 'Referensi gaya arsitektur', 'Preferensi material & warna'] },\n    { title: 'Anggaran & kesiapan kontrak', items: ['Total anggaran pembangunan ditetapkan', 'Anggaran desain dialokasikan', 'Dana cadangan 10–15% disiapkan', 'DP 50% biaya desain siap dibayar', 'Kontak PIC proyek ditentukan'] }\n  ];\n\n  roomData = {\n    residensial: [\n      { cat: 'Area Utama', rooms: ['Ruang Tamu', 'Ruang Keluarga', 'Ruang Makan', 'Dapur', 'Pantri'] },\n      { cat: 'Kamar & Kamar Mandi', rooms: ['Kamar Tidur Utama', 'Kamar Tidur Anak', 'Kamar Tidur Tamu', 'Kamar Mandi Utama', 'Kamar Mandi Anak'] },\n      { cat: 'Ruang Tambahan', rooms: ['Home Office', 'Mushola', 'Ruang Belajar Anak'] },\n      { cat: 'Servis & Area Luar', rooms: ['Kamar ART', 'Gudang', 'Garasi / Carport', 'Laundry', 'Teras', 'Kolam Renang', 'Taman'] }\n    ],\n    komersial: [\n      { cat: 'Area Publik', rooms: ['Lobby / Entrance', 'Ruang Tunggu', 'Resepsionis', 'Showroom / Display', 'Kasir'] },\n      { cat: 'Kafe / Restoran', rooms: ['Area Makan Indoor', 'Area Makan Outdoor', 'Dapur Utama', 'Bar / Barista Station', 'Gudang F&B'] },\n      { cat: 'Kantor', rooms: ['Open Space', 'Ruang Meeting', 'Ruang Direktur', 'Pantri Kantor', 'Ruang Server / IT'] },\n      { cat: 'Hotel & Servis', rooms: ['Kamar Standard', 'Kamar Deluxe', 'Kamar Suite', 'Toilet Umum', 'Pos Keamanan'] }\n    ],\n    akademik: [\n      { cat: 'Ruang Belajar', rooms: ['Ruang Kelas Reguler', 'Ruang Kelas PAUD / TK', 'Lab IPA', 'Lab Komputer', 'Ruang Praktik'] },\n      { cat: 'Penunjang', rooms: ['Perpustakaan', 'Aula Serbaguna', 'Ruang Multimedia', 'Ruang Musik / Seni'] },\n      { cat: 'Administrasi', rooms: ['Ruang Kepala Sekolah', 'Ruang Guru', 'Tata Usaha', 'Ruang BK'] },\n      { cat: 'Fasilitas Siswa', rooms: ['Toilet Siswa', 'Kantin', 'UKS', 'Mushola'] }\n    ],\n    publik: [\n      { cat: 'Area Pelayanan', rooms: ['Lobi Utama', 'Ruang Tunggu Publik', 'Meja Informasi', 'Loket Pelayanan'] },\n      { cat: 'Ruang Kerja', rooms: ['Ruang Kepala Dinas', 'Open Office', 'Ruang Rapat', 'Ruang Sidang'] },\n      { cat: 'Fasilitas Publik', rooms: ['Aula Serbaguna', 'Galeri / Pameran', 'Perpustakaan Umum', 'GOR', 'Taman & RTH'] },\n      { cat: 'Servis', rooms: ['Toilet Umum', 'Toilet Difabel', 'Mushola', 'Kantin', 'Pos Keamanan'] }\n    ],\n    klinik: [\n      { cat: 'Penerimaan Pasien', rooms: ['Ruang Tunggu', 'Pendaftaran', 'Kasir / Administrasi', 'Rekam Medis'] },\n      { cat: 'Pemeriksaan', rooms: ['Periksa Umum', 'Periksa Spesialis', 'Periksa Gigi', 'Periksa Anak'] },\n      { cat: 'Tindakan', rooms: ['Ruang Tindakan', 'IGD', 'Rawat Inap', 'Sterilisasi'] },\n      { cat: 'Penunjang', rooms: ['Apotek', 'Laboratorium', 'Radiologi', 'Nurse Station'] }\n    ],\n    ibadah: [\n      { cat: 'Ruang Ibadah', rooms: ['Ruang Sholat Pria', 'Ruang Sholat Wanita', 'Mihrab & Mimbar', 'Selasar'] },\n      { cat: 'Bersuci', rooms: ['Tempat Wudhu Pria', 'Tempat Wudhu Wanita', 'Toilet', 'Toilet Difabel'] },\n      { cat: 'Pendidikan', rooms: ['Ruang TPA / TPQ', 'Ruang Kajian', 'Perpustakaan Islam', 'Aula'] },\n      { cat: 'Pengelola', rooms: ['Ruang Takmir / DKM', 'Ruang Marbot', 'Gudang', 'Ruang Sound System'] }\n    ]\n  };\n\n  archDeliv = {\n    35000: { name: 'Architecture Lite', items: ['Konsultasi awal & brief', 'Denah skematik berdimensi', 'Tampak depan & samping (2 sisi)', 'Site plan sederhana', 'Render eksterior 3D (1 view)', '1× revisi mayor + 1× revisi minor · 3–5 hari kerja'] },\n    80000: { name: 'Architecture Basic', items: ['Konsultasi awal', 'Gambar denah konsep', 'Desain tampak depan', 'Render eksterior 3D (2 view)', '2× revisi mayor + 2× revisi minor · 10–14 hari kerja'] },\n    125000: { name: 'Architecture Standard', items: ['DED arsitektur lengkap (26 item)', 'Tampak 4 sisi + detail konstruksi', 'DED struktur (15 item)', 'MEP plumbing & elektrikal dasar', 'RAB + BQ + Kurva S', 'Asistensi IMB / PBG', 'Render eksterior 3D (4 view)', '3× revisi mayor + 3× revisi minor · 21–28 hari kerja'] },\n    200000: { name: 'Architecture Premium', items: ['AR + STR + MEP lengkap', 'Desain interior inklusif (22 item)', 'RKS Ar / Str / MEP', 'RAB + BQ + draft kontrak', 'Asistensi IMB / PBG lengkap', 'Pengawasan berkala (9 item)', 'As-built drawing (9 item)', 'Render 3D unlimited eksterior + interior', '4× revisi mayor + 7× revisi minor · 35–60 hari kerja'] }\n  };\n\n  intDeliv = {\n    500000: { name: 'Interior Basic', items: ['Konsultasi & mood board', 'Denah layout 2D', 'Render 3D (1 view) per ruangan', '1× revisi mayor + 1× revisi minor'] },\n    750000: { name: 'Interior Standard', items: ['Konsultasi & mood board', 'Denah layout 2D', 'Render 3D (2 view) per ruangan', 'Gambar kerja interior lengkap', 'Shop drawing standar', 'Bill of Quantity (BOQ)', '1× revisi mayor + 2× revisi minor'] },\n    1250000: { name: 'Interior Premium', items: ['Konsultasi & mood board', 'Denah layout 2D', 'Render 3D unlimited view', 'Gambar kerja interior lengkap', 'Shop drawing full detail', 'Bill of Quantity (BOQ)', 'Daftar material & merk lengkap', 'Spesifikasi finishing detail', '3× revisi mayor + 4× revisi minor'] }\n  };\n\n  fmt(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }\n\n  setF(key) {\n    return e => {\n      const val = e.target.value;\n      this.setState(st => ({ f: Object.assign({}, st.f, { [key]: val }) }));\n    };\n  }\n\n  totals() {\n    const f = this.state.f;\n    let rooms = 0;\n    Object.keys(this.state.rooms).forEach(k => { if (this.state.rooms[k]) rooms += (this.state.qty[k] || 1); });\n    const area = parseFloat(f.lbang) || 0;\n    const archCost = f.arch * area;\n    const intCost = f.intp * rooms;\n    let discPct = 0, discLabel = '';\n    if (f.arch > 0 && f.intp > 0) {\n      if (f.arch >= 200000 || f.intp >= 1250000) { discPct = 0.20; discLabel = '20%'; }\n      else if (f.arch >= 125000 || f.intp >= 750000) { discPct = 0.10; discLabel = '10%'; }\n      else { discPct = 0.05; discLabel = '5%'; }\n    }\n    const subtotal = archCost + intCost;\n    const disc = subtotal * discPct;\n    return { rooms, area, archCost, intCost, discPct, discLabel, disc, subtotal, total: subtotal - disc };\n  }\n\n  roomNames() {\n    const out = [];\n    const cats = this.roomData[this.state.f.tipe] || [];\n    cats.forEach((c, ci) => c.rooms.forEach((name, i) => {\n      const id = this.state.f.tipe + '_' + ci + '_' + i;\n      if (this.state.rooms[id]) out.push(name + ' ×' + (this.state.qty[id] || 1));\n    }));\n    return out;\n  }\n\n  renderVals() {\n    const s = this.state, f = s.f;\n    const cur = this.steps.find(x => x.n === s.step) || this.steps[0];\n    const t = this.totals();\n\n    const stepChips = this.steps.map(x => ({\n      label: x.n + '. ' + x.label,\n      bg: x.n === s.step ? 'var(--color-accent)' : (x.n < s.step ? 'var(--color-accent-2-200)' : 'transparent'),\n      fg: x.n === s.step ? 'var(--color-bg)' : (x.n < s.step ? 'var(--color-accent-2-800)' : 'var(--color-neutral-700)'),\n      bd: x.n === s.step ? 'var(--color-accent)' : (x.n < s.step ? 'var(--color-accent-2-300)' : 'var(--color-divider)'),\n      onClick: () => this.setState({ step: x.n })\n    }));\n\n    const typeOptions = this.typeList.map(x => ({\n      label: x.label,\n      bg: f.tipe === x.key ? 'var(--color-accent-100)' : 'var(--color-neutral-100)',\n      bd: f.tipe === x.key ? 'var(--color-accent)' : 'var(--color-divider)',\n      fg: f.tipe === x.key ? 'var(--color-accent-800)' : 'var(--color-text)',\n      onClick: () => this.setState(st => ({ f: Object.assign({}, st.f, { tipe: x.key }), rooms: {}, qty: {} }))\n    }));\n\n    const cats = this.roomData[f.tipe] || [];\n    const roomGroups = (f.intp && f.tipe) ? cats.map((c, ci) => ({\n      cat: c.cat,\n      items: c.rooms.map((name, i) => {\n        const id = f.tipe + '_' + ci + '_' + i;\n        const sel = !!s.rooms[id];\n        return {\n          name, selected: sel, qty: s.qty[id] || 1,\n          bg: sel ? 'var(--color-accent-100)' : 'var(--color-neutral-100)',\n          bd: sel ? 'var(--color-accent-400)' : 'var(--color-divider)',\n          dotBg: sel ? 'var(--color-accent)' : 'transparent',\n          dotBd: sel ? 'var(--color-accent)' : 'var(--color-neutral-400)',\n          toggle: () => this.setState(st => ({ rooms: Object.assign({}, st.rooms, { [id]: !st.rooms[id] }) })),\n          setQty: e => {\n            const v = Math.max(1, Math.min(20, parseInt(e.target.value) || 1));\n            this.setState(st => ({ qty: Object.assign({}, st.qty, { [id]: v }) }));\n          }\n        };\n      })\n    })) : [];\n\n    const clGroups = this.clGroupsData.map((g, gi) => ({\n      title: g.title,\n      items: g.items.map((label, i) => {\n        const id = gi + '_' + i;\n        const done = !!s.checked[id];\n        return {\n          label, mark: done ? '✓' : '',\n          bg: done ? 'var(--color-accent-2-200)' : 'var(--color-neutral-100)',\n          bd: done ? 'var(--color-accent-2-400)' : 'var(--color-divider)',\n          fg: done ? 'var(--color-accent-2-900)' : 'var(--color-text)',\n          dotBg: done ? 'var(--color-accent-2-600)' : 'transparent',\n          dotBd: done ? 'var(--color-accent-2-600)' : 'var(--color-neutral-400)',\n          toggle: () => this.setState(st => ({ checked: Object.assign({}, st.checked, { [id]: !st.checked[id] }) }))\n        };\n      })\n    }));\n    let clTotal = 0;\n    this.clGroupsData.forEach(g => { clTotal += g.items.length; });\n    const clDone = Object.keys(s.checked).filter(k => s.checked[k]).length;\n\n    const base = { size: '15px', font: 'var(--font-body)', color: 'var(--color-neutral-100)' };\n    const lines = [];\n    if (!f.arch && !f.intp) {\n      lines.push(Object.assign({}, base, { label: 'Pilih paket desain untuk melihat estimasi', val: '—' }));\n    } else {\n      if (f.arch > 0) lines.push(Object.assign({}, base, { label: 'Architecture (' + t.area + ' m² × ' + this.fmt(f.arch) + '/m²)', val: t.archCost > 0 ? this.fmt(t.archCost) : '—' }));\n      if (f.intp > 0) lines.push(Object.assign({}, base, { label: 'Interior (' + t.rooms + ' ruangan × ' + this.fmt(f.intp) + ')', val: t.intCost > 0 ? this.fmt(t.intCost) : '—' }));\n      if (t.discPct > 0) lines.push(Object.assign({}, base, { label: 'Diskon kombinasi ' + t.discLabel, val: '– ' + this.fmt(t.disc), color: 'var(--color-accent-300)' }));\n      lines.push({ size: '22px', font: 'var(--font-heading)', color: 'var(--color-accent-300)', label: 'Total estimasi', val: this.fmt(t.total) });\n    }\n\n    const tipeLabel = (this.typeList.find(x => x.key === f.tipe) || {}).label || '—';\n    const roomNames = this.roomNames();\n    const summary = [\n      { k: 'Nama', v: f.nama || '—' },\n      { k: 'WhatsApp', v: f.wa || '—' },\n      { k: 'Kota', v: f.kota || '—' },\n      { k: 'Tipe proyek', v: tipeLabel },\n      { k: 'Luas bangunan', v: f.lbang ? f.lbang + ' m²' : '—' },\n      { k: 'Jumlah lantai', v: f.lantai || '—' },\n      { k: 'Gaya', v: f.gaya || '—' },\n      { k: 'Anggaran konstruksi', v: f.budget || '—' },\n      { k: 'Paket Architecture', v: f.archLabel || 'Tidak diorder' },\n      { k: 'Paket Interior', v: f.intLabel || 'Tidak diorder' },\n      { k: 'Ruangan interior', v: roomNames.length ? roomNames.join(', ') : '—' },\n      { k: 'Estimasi biaya', v: this.fmt(t.total) },\n      { k: 'Kesiapan checklist', v: clDone + ' / ' + clTotal + ' item' }\n    ];\n\n    const wa = this.props.waNumber || '6285220890007';\n    const sendWA = () => {\n      const msg = [\n        '*BRIEF PROYEK — DAG STUDIO*', '',\n        '*Klien*', 'Nama: ' + (f.nama || '-'), 'WhatsApp: ' + (f.wa || '-'), 'Email: ' + (f.email || '-'),\n        'Kota: ' + (f.kota || '-'), 'Alamat/Maps: ' + (f.alamat || '-'),\n        'Target mulai: ' + (f.timeline || '-'), 'Tahu dari: ' + (f.referral || '-'), '',\n        '*Proyek*', 'Tipe: ' + tipeLabel, 'Luas tanah: ' + (f.ltanah ? f.ltanah + ' m²' : '-'),\n        'Luas bangunan: ' + (f.lbang ? f.lbang + ' m²' : '-'), 'Lantai: ' + (f.lantai || '-'),\n        'Kondisi lahan: ' + (f.kondisi || '-'), 'Anggaran: ' + (f.budget || '-'), 'Gaya: ' + (f.gaya || '-'),\n        'Kebutuhan khusus: ' + (f.khusus || '-'), '',\n        '*Paket*', 'Architecture: ' + (f.archLabel || 'Tidak diorder'), 'Interior: ' + (f.intLabel || 'Tidak diorder'),\n        'Ruangan: ' + (roomNames.length ? roomNames.join(', ') : '-'),\n        'Estimasi: ' + this.fmt(t.total) + (t.discPct ? ' (termasuk diskon ' + t.discLabel + ')' : ''), '',\n        '*Kesiapan*: ' + clDone + '/' + clTotal + ' item checklist', '',\n        'Catatan: ' + (f.catatan || '-'), '', '_Dikirim via Form Brief DAG Studio_'\n      ].join('\\n');\n      window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(msg), '_blank');\n    };\n\n    const lingkup = s.lingkup || 'allin';\n    const showArch = lingkup !== 'interior';\n    const scopeBtns = [\n      { key: 'interior', label: 'Interior saja' },\n      { key: 'arsitektur', label: 'Arsitektur' },\n      { key: 'allin', label: 'Arsitektur + interior' }\n    ].map(x => ({\n      label: x.label,\n      bg: x.key === lingkup ? 'var(--color-accent)' : 'transparent',\n      fg: x.key === lingkup ? 'var(--color-bg)' : 'var(--color-neutral-700)',\n      bd: x.key === lingkup ? 'var(--color-accent)' : 'var(--color-divider)',\n      onClick: () => this.setState(st => ({\n        lingkup: x.key,\n        f: Object.assign({}, st.f, x.key === 'interior' ? { arch: 0, archLabel: '' } : {})\n      }))\n    }));\n\n    const deliverables = [];\n    if (this.archDeliv[f.arch]) deliverables.push({ name: this.archDeliv[f.arch].name, items: this.archDeliv[f.arch].items });\n    if (this.intDeliv[f.intp]) {\n      const d = this.intDeliv[f.intp];\n      deliverables.push({ name: d.name + (t.rooms ? ' — ' + t.rooms + ' ruangan' : ''), items: d.items });\n    }\n    if (t.discPct > 0) deliverables.push({ name: 'Bonus kombinasi', items: ['Diskon ' + t.discLabel + ' dari subtotal', t.discPct >= 0.20 ? 'Pengawasan lapangan 1×' : (t.discPct >= 0.10 ? '1 revisi ekstra' : 'Satu kontrak & satu tim untuk kedua lingkup')] });\n\n    return {\n      showArch, scopeBtns, deliverables, hasDeliverables: deliverables.length > 0,\n      scopeNote: lingkup === 'interior'\n        ? 'Bangunan sudah ada — hanya interior yang dihitung, per ruangan.'\n        : (lingkup === 'allin'\n          ? 'Arsitektur dan interior dihitung sekaligus — diskon kombinasi otomatis diterapkan.'\n          : 'Interior bersifat opsional; boleh Anda tambahkan di bawah bila diperlukan.'),\n      stepChips, stepCounter: 'Langkah ' + s.step + '/5', stepPct: Math.round(s.step / 5 * 100),\n      stepKicker: cur.kicker, stepTitle: cur.title, stepLead: cur.lead,\n      isStep1: s.step === 1, isStep2: s.step === 2, isStep3: s.step === 3, isStep4: s.step === 4, isStep5: s.step === 5,\n      f, typeOptions, roomGroups, resultLines: lines, summary, clGroups,\n      clPct: clTotal ? Math.round(clDone / clTotal * 100) : 0,\n      clLabel: clDone + ' / ' + clTotal,\n      roomsHint: !f.tipe ? 'Pilih tipe proyek di langkah 2 terlebih dahulu.' : (!f.intp ? 'Pilih paket Interior Design di atas untuk mengaktifkan pilihan ruangan.' : 'Ketuk ruangan untuk memilih, lalu atur jumlahnya.'),\n      dpNote: t.total > 0 ? 'DP 50%: ' + this.fmt(t.total * 0.5) + '  ·  Pelunasan: ' + this.fmt(t.total * 0.5) : 'Estimasi bersifat indikatif sebelum survei lokasi.',\n      atFirst: s.step === 1, atLast: s.step === 5,\n      nextLabel: s.step === 4 ? 'Lihat ringkasan' : (s.step === 5 ? 'Selesai' : 'Lanjut'),\n      prev: () => this.setState(st => ({ step: Math.max(1, st.step - 1) })),\n      next: () => this.setState(st => ({ step: Math.min(5, st.step + 1) })),\n      sendWA,\n      set: {\n        nama: this.setF('nama'), wa: this.setF('wa'), email: this.setF('email'), kota: this.setF('kota'),\n        alamat: this.setF('alamat'), timeline: this.setF('timeline'), referral: this.setF('referral'),\n        catatan: this.setF('catatan'), ltanah: this.setF('ltanah'), lbang: this.setF('lbang'),\n        lantai: this.setF('lantai'), kondisi: this.setF('kondisi'), budget: this.setF('budget'),\n        gaya: this.setF('gaya'), khusus: this.setF('khusus'),\n        arch: e => {\n          const v = parseInt(e.target.value) || 0;\n          const label = v ? e.target.options[e.target.selectedIndex].text : '';\n          this.setState(st => ({ f: Object.assign({}, st.f, { arch: v, archLabel: label }) }));\n        },\n        intp: e => {\n          const v = parseInt(e.target.value) || 0;\n          const label = v ? e.target.options[e.target.selectedIndex].text : '';\n          this.setState(st => ({ f: Object.assign({}, st.f, { intp: v, intLabel: label }) }));\n        }\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
